services:
  api:
    build:
      context: ./jwt-app
    environment:
      - JWT_SECRET=my_secret_key
    restart: always

  ui:
    build:
      context: ./ui
    restart: always

  nginx-ingress:
    build:
      context: ./nginx-ingress
    ports:
      - '443:443'
      - '80:80'
    depends_on:
      - api
      - ui
    restart: always